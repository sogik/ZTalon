name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build CLI with build_cli.bat
        shell: cmd
        run: build_cli.bat

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTalon-CLI
          path: |
            dist/cli/ZTalon-CLI.exe
            dist/cli/ZTalon-CLI.exe.sha256
            dist/cli/ZTalon-CLI.exe.md5
