name: Build and Release ZTalon

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build CLI with build_cli.bat
        shell: cmd
        run: build_cli.bat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/cli/ZTalon-CLI.exe
            dist/cli/ZTalon-CLI.exe.sha256
            dist/cli/ZTalon-CLI.exe.md5
